name: Publish npm Package

on:
  push:
    tags:
      - "figma-design-pipeline-v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Pack and inspect release candidate
        id: package
        shell: bash
        run: |
          candidate_dir="$RUNNER_TEMP/release-candidate"
          mkdir -p "$candidate_dir"
          package_manifest="$candidate_dir/npm-pack.json"
          npm pack --ignore-scripts --json --pack-destination "$candidate_dir" > "$package_manifest"
          package_tarball="$(node scripts/verify-package.mjs "$package_manifest" --print-path)"
          chmod a-w "$package_tarball"
          node scripts/verify-package.mjs "$package_manifest"
          printf 'manifest=%s\ntarball=%s\n' "$package_manifest" "$package_tarball" >> "$GITHUB_OUTPUT"
      - name: Test packed release candidate
        shell: bash
        env:
          PACKAGE_MANIFEST: ${{ steps.package.outputs.manifest }}
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          candidate_home="$(mktemp -d)"
          verified_tarball="$(node scripts/verify-package.mjs "$PACKAGE_MANIFEST" --print-path)"
          test "$verified_tarball" = "$PACKAGE_TARBALL"
          npm exec --yes --package="$verified_tarball" -- spetex-figma-design-pipeline-install --help
          HOME="$candidate_home" npm exec --yes --package="$verified_tarball" -- spetex-figma-design-pipeline-install --client all
          test -f "$candidate_home/.figma-design-pipeline/server/index.js"
          test -f "$candidate_home/.figma-design-pipeline/plugin/manifest.json"
          grep -F "$candidate_home/.figma-design-pipeline/server/index.js" "$candidate_home/.codex/config.toml"
          if grep -F ".npm/_npx/" "$candidate_home/.codex/config.toml"; then
            echo "Codex configuration must not reference npm's temporary npx cache" >&2
            exit 1
          fi
      - name: Check whether this version is already published
        id: npm_version
        shell: bash
        run: |
          package_spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$package_spec" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$package_spec is already published; skipping npm publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.npm_version.outputs.published != 'true'
        shell: bash
        env:
          PACKAGE_MANIFEST: ${{ steps.package.outputs.manifest }}
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          verified_tarball="$(node scripts/verify-package.mjs "$PACKAGE_MANIFEST" --print-path)"
          test "$verified_tarball" = "$PACKAGE_TARBALL"
          npm publish "$verified_tarball" --provenance --access public
