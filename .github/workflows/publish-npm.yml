name: Publish npm Package

on:
  push:
    tags:
      - "figma-design-pipeline-v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Check whether this version is already published
        id: npm_version
        shell: bash
        run: |
          package_spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$package_spec" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$package_spec is already published; skipping npm publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.npm_version.outputs.published != 'true'
        run: npm publish --provenance --access public
